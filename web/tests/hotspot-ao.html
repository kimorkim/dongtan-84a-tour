<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>욕실 안내 아이콘 투명도 회귀 검사</title>
<style>body{margin:0}canvas{display:block}</style>
<canvas id="scene"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SceneGTAOPass } from '../src/scene-gtao-pass.ts';
import { loadWorld } from '../src/world.ts';
import { HotspotManager } from '../src/hotspots.ts';

// Real model, lighting and hotspot sprites; only the review camera is fixed.
const renderer = new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.05,120);
camera.position.set(13.87,1.65,-6.02);
camera.lookAt(14.05,1.35,-7.10);
const overview = new THREE.PerspectiveCamera();
// GLBLoader paths are relative to the document, not the importing module.
const base = document.createElement('base');
base.href = '/';
document.head.append(base);
await loadWorld(scene,renderer,()=>{});
const hotspots = new HotspotManager(scene,camera,overview,()=>{},renderer.domElement);
hotspots.update(0,camera);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const Pass = new URLSearchParams(location.search).has('legacy') ? GTAOPass : SceneGTAOPass;
const ao = new Pass(scene,camera,innerWidth,innerHeight);
ao.blendIntensity = .85;
ao.pdRings = 2;
ao.pdSamples = 8;
ao.pdRadiusExponent = 2;
composer.addPass(ao);
composer.addPass(new OutputPass());
renderer.setAnimationLoop(()=>composer.render());
</script>
</html>
